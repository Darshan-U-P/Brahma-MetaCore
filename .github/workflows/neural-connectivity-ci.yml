name: Neural Connectivity CI

on:
  push:
    branches: [main, "feature/**"]
    paths:
      - "src/metaobserver/**"
      - "src/experiments/run_neural_connectivity_gpt2.py"
      - "tests/**"
      - ".github/workflows/neural-connectivity-ci.yml"
  pull_request:
    paths:
      - "src/metaobserver/**"
      - "src/experiments/run_neural_connectivity_gpt2.py"
      - "tests/**"
      - ".github/workflows/neural-connectivity-ci.yml"
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install CPU test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "torch>=2.5,<2.6" "pytest>=8,<9"
      - name: Run new and existing observer tests
        run: python -m pytest tests/test_neural_connectivity.py tests/test_metaobserver.py -q
